<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI 卡牌沙盒</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
    --bg:#F2F2F7;--surface:#FFFFFF;--surface2:#F9F9FC;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.05);
    --text:#1D1D1F;--text2:#6E6E73;--text3:#AEAEB2;
    --red:#FF3B30;--blue:#007AFF;--green:#34C759;--orange:#FF9500;--purple:#AF52DE;--gold:#FFB800;
    --shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow:0 4px 16px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.08);
    --radius:14px;--radius-sm:10px;
}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC','PingFang SC',sans-serif;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
.back-link{position:fixed;top:24px;left:24px;z-index:100;font-size:12px;color:var(--text3);text-decoration:none;transition:color .4s}
.back-link:hover{color:var(--text2)}
.app{display:flex;flex-direction:column;height:100vh}

/* Toolbar */
.toolbar{flex-shrink:0;height:48px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;z-index:20}
.toolbar-title{font-size:14px;font-weight:700;letter-spacing:-.02em;margin-right:auto;margin-left:50px;display:flex;align-items:center;gap:8px}
.toolbar-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
.tool-badge{font-size:11px;padding:4px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-weight:500}
.tool-badge.active{border-color:var(--green);color:var(--green);background:rgba(52,199,89,.06)}

/* Main Layout */
.main-layout{flex:1;display:flex;overflow:hidden}

/* Panel shared */
.panel-header{padding:16px 20px 12px;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:6px;flex-shrink:0}
.panel-header .ph-icon{font-size:14px}

/* Left: Generator */
.left-panel{width:340px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.gen-section{padding:16px 16px 12px;flex-shrink:0}
.gen-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.gen-label .gl-step{width:20px;height:20px;border-radius:50%;background:var(--text);color:#FFF;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gen-hint{font-size:11px;color:var(--text3);margin-bottom:10px;line-height:1.5}
.gen-input{width:100%;min-height:72px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:14px;padding:12px 14px;resize:none;outline:none;transition:all .25s;line-height:1.7}
.gen-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.08);background:#FFF}
.gen-input::placeholder{color:var(--text3)}

.examples-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.example-tag{font-size:11px;padding:4px 10px;border-radius:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap}
.example-tag:hover{border-color:var(--blue);color:var(--blue);background:rgba(0,122,255,.04)}
.gen-btn{margin-top:12px;width:100%;padding:10px;background:var(--text);color:#FFF;border:none;border-radius:22px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .25s;letter-spacing:-.01em}
.gen-btn:hover{background:#333;transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.gen-btn:disabled{opacity:.3;pointer-events:none;transform:none}

.card-preview-list{flex:1;overflow-y:auto;padding:8px 16px;scrollbar-width:none;display:flex;flex-direction:column;gap:8px}
.card-preview-list::-webkit-scrollbar{display:none}

.mini-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;transition:all .2s;position:relative;box-shadow:var(--shadow-sm)}
.mini-card:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-1px)}
.mini-card.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,122,255,.12)}
.mini-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mini-card-name{font-size:13px;font-weight:600;line-height:1.3}
.mini-card-ability{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.4}
.mini-card-stats{display:flex;gap:0}
.mini-stat{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--surface2);font-weight:600;margin-right:6px}
.mini-stat.攻{color:var(--red)}.mini-stat.防{color:var(--blue)}.mini-stat.费{color:var(--orange)}

.empty-hint{text-align:center;padding:48px 20px;color:var(--text3);font-size:13px;line-height:1.8}
.empty-hint .eh-icon{font-size:32px;margin-bottom:12px;opacity:.4}

/* Center: Battle */
.center-panel{flex:1;position:relative;overflow:hidden;background:linear-gradient(160deg,#F2F2F7 0%,#EDEDF2 40%,#F5F5FA 100%)}
.bg-pattern{position:absolute;inset:0;opacity:.03;background-image:radial-gradient(circle,var(--text) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}

.battle-canvas{position:absolute;inset:0;z-index:1;pointer-events:none}
.battle-zone{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 32px;pointer-events:none}
.battle-side{display:flex;flex-direction:column;gap:20px;align-items:center;flex:1}
.side-label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.05em;margin-bottom:8px}
.side-hp{font-size:10px;color:var(--text2);margin-top:-12px}

/* Battle Card */
.battle-card-wrap{pointer-events:auto;position:relative;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.battle-card-wrap:hover{transform:translateY(-6px)}
.battle-card-wrap.active{transform:translateY(-10px);z-index:5}
.battle-card-wrap.victim{animation:cardHit .5s ease}
@keyframes cardHit{0%,100%{transform:translateY(-6px)}20%{transform:translateX(6px)}40%{transform:translateX(-4px)}60%{transform:translateX(2px)}}

.battle-card{width:148px;height:210px;position:relative}
.card-outer{position:absolute;inset:0;border-radius:var(--radius);overflow:visible}
.card-body{position:absolute;inset:2px;border-radius:12px;overflow:hidden;background:#FFF;border:1px solid var(--border)}
.card-shine{position:absolute;inset:0;border-radius:12px;background:linear-gradient(145deg,rgba(255,255,255,.5) 0%,transparent 40%,rgba(255,255,255,.3) 100%);pointer-events:none;z-index:3}
.card-color-strip{position:absolute;top:0;left:0;right:0;height:42px;border-radius:12px 12px 0 0;z-index:0;transition:background .4s}
.card-header-line{position:absolute;top:8px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.card-name-display{font-size:10px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.1)}
.card-cost-badge{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card-art-zone{position:absolute;top:40px;left:8px;right:8px;bottom:56px;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:1}
.card-art-zone svg{width:80%;height:80%}
.card-info-bar{position:absolute;bottom:30px;left:8px;right:8px;display:flex;gap:6px;z-index:2}
.card-stat-box{flex:1;text-align:center;border-radius:6px;padding:4px 0;background:rgba(0,0,0,.03)}
.card-stat-box .sv{font-size:15px;font-weight:700;line-height:1}
.card-stat-box .sl{font-size:8px;color:var(--text3);margin-top:1px}
.card-ability-tag{position:absolute;bottom:8px;left:10px;right:10px;font-size:9px;text-align:center;z-index:2;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card-border-glow{position:absolute;inset:-2px;border-radius:16px;opacity:0;transition:opacity .4s;pointer-events:none}
.battle-card-wrap.active .card-border-glow{opacity:1}

/* VS */
.vs-center{display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;min-width:90px}
.vs-divider-text{font-size:28px;font-weight:700;color:rgba(0,0,0,.06);letter-spacing:.1em}
.vs-turn-text{font-size:11px;font-weight:600;letter-spacing:.05em;padding:4px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm)}

/* Right panel */
.right-panel{width:270px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column}
.battle-log{flex:1;overflow-y:auto;padding:12px 14px;scrollbar-width:none;display:flex;flex-direction:column;gap:6px}
.battle-log::-webkit-scrollbar{display:none}
.log-entry{font-size:11px;padding:8px 12px;border-radius:8px;background:var(--surface2);line-height:1.6;animation:logIn .35s ease;display:flex;gap:8px}
@keyframes logIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.log-icon{font-size:14px;flex-shrink:0;width:20px;text-align:center}
.log-entry.伤害 .log-icon{color:var(--red)}.log-entry.治疗 .log-icon{color:var(--green)}.log-entry.系统 .log-icon{color:var(--blue)}.log-entry.回合 .log-icon{color:var(--orange)}
.log-entry.伤害{background:rgba(255,59,48,.04);border-left:3px solid var(--red)}
.log-entry.治疗{background:rgba(52,199,89,.04);border-left:3px solid var(--green)}
.log-entry.系统{background:rgba(0,122,255,.04);border-left:3px solid var(--blue)}
.log-entry.回合{background:rgba(255,149,0,.04);border-left:3px solid var(--orange)}

/* Control bar */
.control-bar{height:56px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px}
.ctrl-btn{padding:10px 20px;border-radius:22px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .25s;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.ctrl-btn svg{width:15px;height:15px}
.ctrl-btn:hover{border-color:rgba(0,0,0,.15);box-shadow:var(--shadow)}
.ctrl-btn.primary{background:var(--text);color:#FFF;border-color:var(--text)}
.ctrl-btn.primary:hover{background:#333}
.ctrl-btn:disabled{opacity:.25;pointer-events:none}
.hp-display{display:flex;align-items:center;gap:8px;margin-left:auto}
.hp-label{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.03em}
.hp-track{width:130px;height:8px;background:rgba(0,0,0,.06);border-radius:4px;overflow:hidden}
.hp-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.hp-player-fill{background:var(--green);box-shadow:0 0 8px rgba(52,199,89,.3)}
.hp-enemy-fill{background:var(--red);box-shadow:0 0 8px rgba(255,59,48,.3)}
.hp-val{font-size:12px;font-weight:700;min-width:40px;text-align:right}
.hp-val.危险{color:var(--red);animation:hpBlink .6s ease-in-out infinite}
@keyframes hpBlink{0%,100%{opacity:1}50%{opacity:.3}}

.dmg-float{position:absolute;pointer-events:none;font-size:22px;font-weight:800;font-family:inherit;z-index:10;animation:dmgUp 1s ease-out forwards;letter-spacing:-.02em;text-shadow:0 2px 8px rgba(0,0,0,.1)}
@keyframes dmgUp{0%{opacity:1;transform:translateY(0) scale(.8)}20%{opacity:1;transform:translateY(-8px) scale(1.2)}100%{opacity:0;transform:translateY(-56px) scale(.7)}}

.tip-overlay{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:20px;background:rgba(0,0,0,.75);color:#FFF;font-size:12px;pointer-events:none;z-index:10;opacity:0;transition:opacity .3s;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tip-overlay.visible{opacity:1}

@media(max-width:900px){.left-panel{width:260px}.right-panel{width:200px}.battle-card{width:120px;height:170px}.battle-zone{padding:0 12px}}
@media(max-width:700px){.main-layout{flex-direction:column}.left-panel{width:100%;max-height:220px;border-right:none;border-bottom:1px solid var(--border)}.right-panel{width:100%;max-height:140px;border-left:none;border-top:1px solid var(--border)}.center-panel{min-height:320px}}
</style>
</head>
<body>
<a href="/" class="back-link">← 返回</a>
<div class="app">

<div class="toolbar">
    <span class="toolbar-title"><span class="toolbar-dot"></span>AI 卡牌沙盒</span>
    <span class="tool-badge active" id="tool-status">就绪</span>
    <span class="tool-badge" id="tool-turn">回合 0</span>
</div>

<div class="main-layout">
    <!-- 左面板：卡牌生成器 -->
    <div class="left-panel">
        <div class="panel-header"><span class="ph-icon">⚡</span>催化器 · 文本生成卡牌</div>
        <div class="gen-section">
            <div class="gen-label"><span class="gl-step">1</span>输入灵感</div>
            <div class="gen-hint">输入一段文字描述，系统将自动解析并生成卡牌</div>
            <textarea class="gen-input" id="gen-input" placeholder="比如：烈焰风暴吞噬一切，但每一场大火之后都有新芽破土…" maxlength="120"></textarea>
            <div class="examples-row" id="examples-row">
                <span class="example-tag">星辰陨落</span>
                <span class="example-tag">钢铁洪流</span>
                <span class="example-tag">虚空裂隙</span>
            </div>
            <div class="gen-label" style="margin-top:14px"><span class="gl-step">2</span>生成卡牌</div>
            <button class="gen-btn" id="gen-btn">✦  生成卡牌</button>
        </div>
        <div class="panel-header">📋 我的卡牌（最多 6 张）</div>
        <div class="card-preview-list" id="card-list">
            <div class="empty-hint"><div class="eh-icon">🎴</div>输入灵感并点击生成<br>你的第一张卡牌将出现在这里</div>
        </div>
    </div>

    <!-- 中面板：战场 -->
    <div class="center-panel" id="battlefield">
        <div class="bg-pattern"></div>
        <canvas class="battle-canvas" id="battle-canvas"></canvas>
        <div class="battle-zone" id="battle-zone">
            <div class="battle-side" id="player-side">
                <div class="side-label">👤 你的战场</div>
            </div>
            <div class="vs-center">
                <div class="vs-divider-text">VS</div>
                <div class="vs-turn-text" id="vs-turn">等待开局</div>
            </div>
            <div class="battle-side" id="enemy-side">
                <div class="side-label">🤖 AI 对手</div>
            </div>
        </div>
        <div class="tip-overlay" id="tip-overlay"></div>
    </div>

    <!-- 右面板：战斗日志 -->
    <div class="right-panel">
        <div class="panel-header">📜 战斗记录</div>
        <div class="battle-log" id="battle-log">
            <div class="log-entry 系统"><span class="log-icon">✦</span>欢迎来到卡牌沙盒。<br>输入灵感生成卡牌，部署到战场开始对决。</div>
        </div>
    </div>
</div>

<!-- 底部控制栏 -->
<div class="control-bar">
    <button class="ctrl-btn primary" id="btn-deploy" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        部署上场
    </button>
    <button class="ctrl-btn" id="btn-next-turn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        下一回合
    </button>
    <button class="ctrl-btn" id="btn-reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M4 18a9 9 0 1 0 3-13.2"/></svg>
        重置
    </button>
    <div class="hp-display" style="margin-left:auto">
        <span class="hp-label">你的生命</span>
        <div class="hp-track"><div class="hp-fill hp-player-fill" id="player-hp-fill" style="width:100%"></div></div>
        <span class="hp-val" id="player-hp-val">30/30</span>
    </div>
    <div class="hp-display" style="margin-left:16px">
        <span class="hp-label">AI 生命</span>
        <div class="hp-track"><div class="hp-fill hp-enemy-fill" id="enemy-hp-fill" style="width:100%"></div></div>
        <span class="hp-val" id="enemy-hp-val">30/30</span>
    </div>
</div>

</div>

<script>
(function(){
const cardList=document.getElementById('card-list'),genInput=document.getElementById('gen-input'),genBtn=document.getElementById('gen-btn'),
playerSide=document.getElementById('player-side'),enemySide=document.getElementById('enemy-side'),
battleLog=document.getElementById('battle-log'),battlefield=document.getElementById('battlefield'),
battleCanvas=document.getElementById('battle-canvas'),bCtx=battleCanvas.getContext('2d'),
btnDeploy=document.getElementById('btn-deploy'),btnNext=document.getElementById('btn-next-turn'),btnReset=document.getElementById('btn-reset'),
vsTurn=document.getElementById('vs-turn'),toolTurn=document.getElementById('tool-turn'),toolStatus=document.getElementById('tool-status'),
playerHpFill=document.getElementById('player-hp-fill'),playerHpVal=document.getElementById('player-hp-val'),
enemyHpFill=document.getElementById('enemy-hp-fill'),enemyHpVal=document.getElementById('enemy-hp-val'),
tipOverlay=document.getElementById('tip-overlay'),examplesRow=document.getElementById('examples-row');

let playerCards=[],enemyCards=[],deployedCards=[],playerHP=30,enemyHP=30,turn=0,isPlayerTurn=true;
let attackLines=[],selectedCardIdx=-1,gameOver=false;

const COLOR_THEMES=[
    {name:'烈焰',primary:'#E8483B',light:'#FDE8E6',accent:'#FF6B5B',grad:'linear-gradient(135deg,#E8483B,#FF8960)'},
    {name:'深海',primary:'#1A73E8',light:'#E3ECFB',accent:'#5094F0',grad:'linear-gradient(135deg,#1A73E8,#5094F0)'},
    {name:'翡翠',primary:'#0D904F',light:'#E4F4EB',accent:'#34C759',grad:'linear-gradient(135deg,#0D904F,#34C759)'},
    {name:'紫晶',primary:'#8E4EC6',light:'#F3EBFA',accent:'#B47CE0',grad:'linear-gradient(135deg,#8E4EC6,#B47CE0)'},
    {name:'琥珀',primary:'#E07000',light:'#FFF0DE',accent:'#FFB340',grad:'linear-gradient(135deg,#E07000,#FFB340)'},
    {name:'暗影',primary:'#3C3C3C',light:'#EEEEEE',accent:'#6E6E6E',grad:'linear-gradient(135deg,#3C3C3C,#6E6E6E)'},
];

const GEOMETRY_SVG={
    '星阵':(c)=>`<polygon points="40,8 48,28 68,28 52,40 58,62 40,50 22,62 28,40 12,28 32,28" fill="${c}" opacity="0.12"/><polygon points="40,10 47,27 65,27 51,38 56,58 40,48 24,58 29,38 15,27 33,27" fill="none" stroke="${c}" stroke-width="1.2" opacity="0.7"><animateTransform attributeName="transform" type="rotate" from="0 40 34" to="360 40 34" dur="12s" repeatCount="indefinite"/></polygon><circle cx="40" cy="34" r="3" fill="${c}" opacity="0.6"/>`,
    '双环':(c)=>`<circle cx="40" cy="34" r="26" fill="${c}" opacity="0.06"/><circle cx="40" cy="34" r="26" fill="none" stroke="${c}" stroke-width="1" opacity="0.6"/><circle cx="40" cy="34" r="16" fill="none" stroke="${c}" stroke-width="0.8" opacity="0.4"><animateTransform attributeName="transform" type="rotate" from="0 40 34" to="360 40 34" dur="7s" repeatCount="indefinite"/></circle><circle cx="40" cy="34" r="5" fill="${c}" opacity="0.3"/><line x1="40" y1="8" x2="40" y2="18" stroke="${c}" stroke-width="1.5" opacity="0.5"/><line x1="40" y1="50" x2="40" y2="60" stroke="${c}" stroke-width="1.5" opacity="0.5"/><line x1="14" y1="34" x2="24" y2="34" stroke="${c}" stroke-width="1.5" opacity="0.5"/><line x1="56" y1="34" x2="66" y2="34" stroke="${c}" stroke-width="1.5" opacity="0.5"/>`,
    '矩阵':(c)=>{
        let s='';
        for(let i=0;i<6;i++){const y=10+i*11;s+=`<line x1="6" y1="${y}" x2="74" y2="${y}" stroke="${c}" stroke-width="0.6" opacity="${.12+i*.08}"/>`;}
        for(let i=0;i<4;i++){const x=14+i*16;s+=`<line x1="${x}" y1="6" x2="${x}" y2="62" stroke="${c}" stroke-width="0.6" opacity="0.2"/>`;}
        s+=`<circle cx="40" cy="34" r="4" fill="${c}" opacity="0.5"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite"/></circle>`;
        s+=`<rect x="26" y="20" width="28" height="28" fill="none" stroke="${c}" stroke-width="0.8" opacity="0.3"><animateTransform attributeName="transform" type="rotate" from="0 40 34" to="360 40 34" dur="9s" repeatCount="indefinite"/></rect>`;
        return s;
    },
    '漩涡':(c)=>`<path d="M40,8 Q56,20 52,34 Q48,48 34,52 Q20,56 12,44 Q4,30 14,20 Q24,10 40,8Z" fill="${c}" opacity="0.07"/><path d="M40,10 Q54,20 50,33 Q46,45 34,49 Q22,52 14,42 Q7,30 16,21" fill="none" stroke="${c}" stroke-width="1" opacity="0.6"><animateTransform attributeName="transform" type="rotate" from="0 40 30" to="360 40 30" dur="8s" repeatCount="indefinite"/></path><circle cx="36" cy="26" r="2" fill="${c}" opacity="0.6"/><circle cx="46" cy="38" r="1.5" fill="${c}" opacity="0.4"/>`,
};

const ABILITY_POOL=[
    {name:'破甲',desc:'攻击时无视目标 {n} 点防御',logic:'破甲',val:()=>Math.floor(Math.random()*3)+1},
    {name:'吸血',desc:'造成伤害时回复 {n} 点生命',logic:'吸血',val:()=>Math.floor(Math.random()*3)+2},
    {name:'荆棘',desc:'受到攻击时反弹 {n} 点伤害',logic:'荆棘',val:()=>Math.floor(Math.random()*3)+1},
    {name:'连击',desc:'有概率额外攻击一次，造成 {n} 点伤害',logic:'连击',val:()=>Math.floor(Math.random()*2)+2},
    {name:'守护',desc:'入场时为友方恢复 {n} 点生命',logic:'守护',val:()=>Math.floor(Math.random()*3)+3},
    {name:'灼烧',desc:'回合开始时对敌方造成 {n} 点持续伤害',logic:'灼烧',val:()=>Math.floor(Math.random()*2)+1},
];

function parseTextToCard(text){
    const seed=[...text].reduce((a,c)=>a+c.charCodeAt(0),0);
    const rng=(min,max)=>Math.abs(Math.floor((Math.sin(seed*(min+37))*43758.5453)%1)*(max-min+1))+min;

    const prefixes=['虚空','星辰','烈焰','暗影','光辉','深渊','觉醒','龙魂','暴风','雷电','冰霜','熔岩','神圣','幽光','钢铁','翡翠'];
    const suffixes=['之刃','之盾','使者','行者','之核','意志','风暴','共鸣','回响','裂痕','脉动','纪元','咆哮','序曲','轮回','引力'];
    const name=prefixes[Math.floor(seed%prefixes.length)]+suffixes[Math.floor((seed*13)%suffixes.length)];

    let themeIdx=Math.floor(seed%COLOR_THEMES.length);
    if(text.includes('火')||text.includes('烈焰')||text.includes('燃'))themeIdx=0;
    if(text.includes('水')||text.includes('海')||text.includes('冰'))themeIdx=1;
    if(text.includes('自然')||text.includes('森')||text.includes('生长'))themeIdx=2;
    if(text.includes('虚空')||text.includes('暗')||text.includes('深渊'))themeIdx=5;

    const atk=rng(2,12);
    const def=rng(1,10);
    const cost=Math.min(5,Math.max(1,Math.ceil((atk+def)/5)));

    const geoKeys=['星阵','双环','矩阵','漩涡'];
    const ability=ABILITY_POOL[Math.floor(seed%ABILITY_POOL.length)];

    return{
        id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        name,theme:COLOR_THEMES[themeIdx],
        stats:{攻击:atk,防御:def,费用:cost},
        geometry:geoKeys[Math.floor(seed%geoKeys.length)],
        ability:{...ability,val:ability.val()}
    };
}

function generateEnemyCard(){
    const prompts=['混沌裂隙不断扩张','数据风暴席卷矩阵','太古巨龙从长眠中苏醒','量子纠缠撕裂现实','无尽深渊回响着低语','钢铁意志永不破碎'];
    return parseTextToCard(prompts[Math.floor(Math.random()*prompts.length)]);
}

function renderMiniCard(card,idx){
    const d=document.createElement('div');
    d.className='mini-card';d.dataset.idx=idx;
    d.innerHTML=`<div class="mini-card-header"><span class="mini-card-name" style="color:${card.theme.primary}">${card.name}</span></div><div class="mini-card-stats"><span class="mini-stat 攻">⚔ ${card.stats.攻击}</span><span class="mini-stat 防">🛡 ${card.stats.防御}</span><span class="mini-stat 费">⏣ ${card.stats.费用}</span></div><div class="mini-card-ability">${card.ability.name}：${card.ability.desc.replace('{n}',card.ability.val)}</div>`;
    d.addEventListener('click',()=>{
        document.querySelectorAll('.mini-card').forEach(c=>c.classList.remove('selected'));
        d.classList.add('selected');selectedCardIdx=idx;btnDeploy.disabled=false;
        if(window._track)window._track("deploy_card");showTip('已选中「'+card.name+'」，点击下方「部署上场」开始对决');
    });
    return d;
}

function renderPlayerList(){
    cardList.innerHTML='';
    if(playerCards.length===0){cardList.innerHTML='<div class="empty-hint"><div class="eh-icon">🎴</div>输入灵感并点击生成<br>你的第一张卡牌将出现在这里</div>';btnDeploy.disabled=true;return;}
    playerCards.forEach((c,i)=>cardList.appendChild(renderMiniCard(c,i)));
}

function renderBattleCard(card,active){
    const c=card.theme;
    const geo=GEOMETRY_SVG[card.geometry]?GEOMETRY_SVG[card.geometry](c.primary):GEOMETRY_SVG['星阵'](c.primary);
    return`<div class="battle-card-wrap${active?' active':''}">
    <div class="card-border-glow" style="box-shadow:0 0 28px ${c.accent}44,inset 0 0 28px ${c.accent}11"></div>
    <div class="battle-card"><div class="card-outer">
    <div class="card-body"><div class="card-shine"></div>
    <div class="card-color-strip" style="background:${c.grad}"></div>
    <div class="card-header-line"><span class="card-name-display" style="color:#FFF">${card.name}</span><span class="card-cost-badge" style="color:${c.primary}">${card.stats.费用}</span></div>
    <div class="card-art-zone"><svg viewBox="0 0 80 68" xmlns="http://www.w3.org/2000/svg">${geo}</svg></div>
    <div class="card-info-bar"><div class="card-stat-box"><div class="sv" style="color:var(--red)">${card.stats.攻击}</div><div class="sl">攻击</div></div><div class="card-stat-box"><div class="sv" style="color:var(--blue)">${card.stats.防御}</div><div class="sl">防御</div></div></div>
    <div class="card-ability-tag">${card.ability.name}：${card.ability.desc.replace('{n}',card.ability.val)}</div>
    </div></div></div></div>`;
}

function renderBattlefield(){
    const pDeployed=deployedCards.filter(d=>d.isPlayer);
    const eDeployed=deployedCards.filter(d=>!d.isPlayer);
    playerSide.innerHTML='<div class="side-label">👤 你的战场</div>';
    pDeployed.forEach(d=>{const w=document.createElement('div');w.innerHTML=renderBattleCard(d.card,isPlayerTurn&&!gameOver);playerSide.appendChild(w.firstElementChild);});
    if(pDeployed.length===0){const e=document.createElement('div');e.style.cssText='font-size:11px;color:var(--text3);padding:20px';e.textContent='等待部署卡牌...';playerSide.appendChild(e);}
    enemySide.innerHTML='<div class="side-label">🤖 AI 对手</div>';
    eDeployed.forEach(d=>{const w=document.createElement('div');w.innerHTML=renderBattleCard(d.card,!isPlayerTurn&&!gameOver);enemySide.appendChild(w.firstElementChild);});
    if(eDeployed.length===0){const e=document.createElement('div');e.style.cssText='font-size:11px;color:var(--text3);padding:20px';e.textContent='等待对手入场...';enemySide.appendChild(e);}
    btnNext.disabled=deployedCards.length===0||gameOver;
}

function addLog(msg,type){
    const icons={伤害:'💥',治疗:'💚',系统:'✦',回合:'🔄'};
    const d=document.createElement('div');d.className='log-entry '+type;
    d.innerHTML=`<span class="log-icon">${icons[type]||'·'}</span><span>${msg}</span>`;
    battleLog.appendChild(d);battleLog.scrollTop=battleLog.scrollHeight;
}

function showTip(msg){tipOverlay.textContent=msg;tipOverlay.classList.add('visible');clearTimeout(tipOverlay._t);tipOverlay._t=setTimeout(()=>tipOverlay.classList.remove('visible'),2800);}

function spawnFloat(x,y,text,color){
    const el=document.createElement('div');el.className='dmg-float';
    el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';el.style.color=color;
    battlefield.appendChild(el);setTimeout(()=>el.remove(),1100);
}

function updateHPs(){
    playerHpFill.style.width=Math.max(0,(playerHP/30)*100)+'%';playerHpVal.textContent=Math.max(0,playerHP)+'/30';
    enemyHpFill.style.width=Math.max(0,(enemyHP/30)*100)+'%';enemyHpVal.textContent=Math.max(0,enemyHP)+'/30';
    if(playerHP<=10)playerHpVal.classList.add('危险');else playerHpVal.classList.remove('危险');
    if(enemyHP<=10)enemyHpVal.classList.add('危险');else enemyHpVal.classList.remove('危险');
}

function addAttackLine(isPlayer){
    const pCards=playerSide.querySelectorAll('.battle-card-wrap');
    const eCards=enemySide.querySelectorAll('.battle-card-wrap');
    if(pCards.length>0&&eCards.length>0){
        const from=isPlayer?pCards[pCards.length-1]:eCards[eCards.length-1];
        const to=isPlayer?eCards[eCards.length-1]:pCards[pCards.length-1];
        const bR=battlefield.getBoundingClientRect(),fR=from.getBoundingClientRect(),tR=to.getBoundingClientRect();
        attackLines.push({x1:fR.left-bR.left+fR.width/2,y1:fR.top-bR.top+fR.height/2,x2:tR.left-bR.left+tR.width/2,y2:tR.top-bR.top+tR.height/2,life:1,decay:.02,color:isPlayer?'#FF3B30':'#007AFF'});
        if(isPlayer)showTip('你的卡牌发起攻击！');
    }
}

function resolveAttack(card,isPlayer){
    const atk=card.stats.攻击;let dmg=Math.max(1,atk-Math.floor(Math.random()*4));
    if(card.ability.logic==='破甲')dmg=Math.max(1,atk+card.ability.val-Math.floor(Math.random()*2));
    if(card.ability.logic==='连击'&&Math.random()<.35){dmg+=card.ability.val;addLog(`${card.name} 触发连击！额外造成 ${card.ability.val} 点伤害`,'伤害');}
    if(isPlayer){enemyHP=Math.max(0,enemyHP-dmg);addLog(`你的 ${card.name} 发动攻击，造成 <b style="color:var(--red)">${dmg}</b> 点伤害`,'伤害');}
    else{playerHP=Math.max(0,playerHP-dmg);addLog(`AI ${card.name} 反击，造成 <b style="color:var(--red)">${dmg}</b> 点伤害`,'伤害');}
    if(card.ability.logic==='吸血'){if(isPlayer){playerHP=Math.min(30,playerHP+card.ability.val);addLog(`${card.name} 吸血回复 ${card.ability.val} 点生命`,'治疗');}else{enemyHP=Math.min(30,enemyHP+card.ability.val);addLog(`AI ${card.name} 吸血回复 ${card.ability.val} 点生命`,'治疗');}}
    if(card.ability.logic==='荆棘'&&!isPlayer){enemyHP=Math.max(0,enemyHP-card.ability.val);addLog(`荆棘反弹！对 AI 造成 ${card.ability.val} 点伤害`,'伤害');}
    addAttackLine(isPlayer);
    const side=isPlayer?enemySide:playerSide;const cards=side.querySelectorAll('.battle-card-wrap');
    if(cards.length>0){const r=cards[cards.length-1].getBoundingClientRect(),bR=battlefield.getBoundingClientRect();spawnFloat(r.left-bR.left+r.width/2-20,r.top-bR.top,'-'+dmg,'#FF3B30');}
    updateHPs();
}

function checkGameOver(){
    if(playerHP<=0){gameOver=true;addLog('💀 你被击败了。3 秒后自动重置','系统');vsTurn.textContent='败北';vsTurn.style.color='var(--red)';toolStatus.textContent='结束';toolStatus.classList.remove('active');btnNext.disabled=true;btnDeploy.disabled=true;setTimeout(resetGame,3000);}
    else if(enemyHP<=0){gameOver=true;addLog('🏆 胜利！AI 已被击溃','系统');vsTurn.textContent='胜利';vsTurn.style.color='var(--green)';toolStatus.textContent='结束';toolStatus.classList.remove('active');btnNext.disabled=true;btnDeploy.disabled=true;setTimeout(resetGame,3000);}
}

function deployCard(){
    if(selectedCardIdx<0||selectedCardIdx>=playerCards.length)return;
    const card=playerCards[selectedCardIdx];const enemy=generateEnemyCard();
    deployedCards=[{card,isPlayer:true},{card:enemy,isPlayer:false}];enemyCards.push(enemy);
    turn=1;isPlayerTurn=true;selectedCardIdx=-1;gameOver=false;
    addLog(`⚔ 对决开始！你派出「${card.name}」`,'系统');addLog(`🤖 AI 派出「${enemy.name}」应战`,'系统');
    vsTurn.textContent='你的回合';vsTurn.style.color='var(--green)';toolTurn.textContent='回合 1';toolStatus.textContent='战斗中';toolStatus.classList.add('active');
    renderPlayerList();renderBattlefield();btnDeploy.disabled=true;btnNext.disabled=false;
    showTip('点击「下一回合」让你的卡牌发动攻击');
    document.querySelectorAll('.mini-card').forEach(c=>c.classList.remove('selected'));
}

function nextTurn(){
    if(gameOver)return;turn++;toolTurn.textContent='回合 '+turn;
    const pD=deployedCards.filter(d=>d.isPlayer),eD=deployedCards.filter(d=>!d.isPlayer);
    if(isPlayerTurn&&pD.length>0){
        resolveAttack(pD[0].card,true);
        if(pD[0].card.ability.logic==='灼烧'){enemyHP=Math.max(0,enemyHP-pD[0].card.ability.val);addLog(`灼烧效果：对 AI 造成 ${pD[0].card.ability.val} 点持续伤害`,'伤害');updateHPs();}
        if(pD[0].card.ability.logic==='守护'){playerHP=Math.min(30,playerHP+pD[0].card.ability.val);addLog(`${pD[0].card.name} 守护效果触发，回复 ${pD[0].card.ability.val} 点生命`,'治疗');updateHPs();}
        addLog('--- 你的回合结束 ---','回合');
    }else if(!isPlayerTurn&&eD.length>0){
        resolveAttack(eD[0].card,false);
        if(eD[0].card.ability.logic==='灼烧'){playerHP=Math.max(0,playerHP-eD[0].card.ability.val);addLog(`AI 灼烧：对你造成 ${eD[0].card.ability.val} 点持续伤害`,'伤害');updateHPs();}
        addLog('--- AI 回合结束 ---','回合');
    }
    isPlayerTurn=!isPlayerTurn;vsTurn.textContent=isPlayerTurn?'你的回合':'AI 回合';vsTurn.style.color=isPlayerTurn?'var(--green)':'var(--red)';
    renderBattlefield();
    if(!gameOver&&!isPlayerTurn){
        btnNext.disabled=true;showTip('AI 正在思考...');
        setTimeout(()=>{if(!gameOver){nextTurn();btnNext.disabled=deployedCards.length===0||gameOver;}},1400);
    }
}

function resetGame(){
    playerCards=[];enemyCards=[];deployedCards=[];playerHP=30;enemyHP=30;turn=0;isPlayerTurn=true;selectedCardIdx=-1;gameOver=false;attackLines=[];
    battlefield.querySelectorAll('.dmg-float').forEach(el=>el.remove());
    vsTurn.textContent='等待开局';vsTurn.style.color='var(--text2)';toolTurn.textContent='回合 0';toolStatus.textContent='就绪';toolStatus.classList.add('active');
    renderPlayerList();renderBattlefield();updateHPs();
    battleLog.innerHTML='<div class="log-entry 系统"><span class="log-icon">✦</span>已重置。输入灵感生成新卡牌吧。</div>';
    btnDeploy.disabled=true;btnNext.disabled=true;
}

genBtn.addEventListener('click',()=>{
    const text=genInput.value.trim();if(!text){showTip('请先输入一段灵感文字');return;}
    if(playerCards.length>=6){showTip('卡组已满，最多只能拥有 6 张卡牌');return;}
    const card=parseTextToCard(text);playerCards.push(card);renderPlayerList();
    if(window._track)window._track("generate_card");addLog(`📄 生成卡牌：「${card.name}」 攻击${card.stats.攻击} 防御${card.stats.防御}`,'系统');
    showTip('卡牌已生成！在左侧列表点击选中，再点击下方「部署上场」');
    genInput.value='';genInput.focus();
});
genInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();genBtn.click();}});
examplesRow.addEventListener('click',e=>{const t=e.target.closest('.example-tag');if(t){genInput.value=t.textContent;genInput.focus();}});
btnDeploy.addEventListener('click',deployCard);btnNext.addEventListener('click',nextTurn);btnReset.addEventListener('click',resetGame);

function resizeCanvas(){const r=battlefield.getBoundingClientRect();battleCanvas.width=r.width;battleCanvas.height=r.height;}
window.addEventListener('resize',resizeCanvas);resizeCanvas();

function drawCanvas(){
    const W=battleCanvas.width,H=battleCanvas.height;bCtx.clearRect(0,0,W,H);
    attackLines=attackLines.filter(l=>{l.life-=l.decay;if(l.life<=0)return false;
        bCtx.save();bCtx.globalAlpha=l.life*.6;bCtx.strokeStyle=l.color;bCtx.lineWidth=2.5;bCtx.shadowColor=l.color;bCtx.shadowBlur=10;bCtx.beginPath();
        const t=1-l.life;bCtx.moveTo(l.x1,l.y1);
        const cpX=(l.x1+l.x2)/2+Math.sin(t*6)*15,cpY=(l.y1+l.y2)/2+Math.cos(t*7)*15;
        bCtx.quadraticCurveTo(cpX,cpY,l.x2,l.y2);bCtx.stroke();
        bCtx.globalAlpha=l.life;bCtx.fillStyle=l.color;bCtx.shadowBlur=14;bCtx.beginPath();bCtx.arc(l.x1+(l.x2-l.x1)*t,l.y1+(l.y2-l.y1)*t,4,0,Math.PI*2);bCtx.fill();
        bCtx.restore();return true;
    });
    requestAnimationFrame(drawCanvas);
}
requestAnimationFrame(drawCanvas);
renderPlayerList();
})();
</script>
<script src="/stats/track.js"></script>
</body>
</html>
