<div class="wall"><div class="wall-img"></div><div class="wall-tint"></div><div class="wall-grain"></div></div>

<!-- ============ 锁屏 ============ -->
<div class="lock" id="lock">
  <div class="lock-date" id="lockDate">—</div>
  <div class="lock-time" id="lockTime">--:--</div>
  <div class="lock-user">
    <img class="lock-av" src="avatar.png" alt="">

    <button class="lock-enter" id="lockEnter" type="button">进来坐坐</button>
  </div>
</div>

<!-- ============ 菜单栏 ============ -->
<header class="menubar" id="menubar">
  <button class="mb-brand" id="mbBrand" type="button"><span class="mb-mk"></span>黄淼 OS</button>
  <button class="mb-menu" data-open="rooms" type="button">房间</button>
  <button class="mb-menu" data-open="works" type="button">作品</button>
  <button class="mb-menu" data-open="about" type="button">关于</button>
  <button class="mb-menu" data-open="contact" type="button">联系</button>
  <span class="mb-sp"></span>
  <span class="mb-st">
    <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round"><use href="#ic-wifi"/></svg>
    <svg viewBox="0 0 26 13" style="width:24px;height:12px;fill:none;stroke:currentColor;stroke-width:1.1"><use href="#ic-batt"/></svg>
  </span>
  <span class="mb-clock" id="mbClock">--</span>
</header>

<!-- ============ 桌面 ============ -->
<main class="desktop" id="desktop">
  <div class="desk-icons">
    <button class="desk-ic" data-open="rooms" type="button">
      <span class="art"><svg viewBox="0 0 96 96"><use href="#ap-room"/></svg></span>
      <span class="lb">我的房间</span>
    </button>
    <button class="desk-ic" data-open="works" type="button">
      <span class="art"><svg viewBox="0 0 96 96"><use href="#ap-works"/></svg></span>
      <span class="lb">我的作品</span>
    </button>
    <button class="desk-ic" data-open="readme" type="button">
      <span class="art"><svg viewBox="0 0 96 96"><use href="#ap-readme"/></svg></span>
      <span class="lb">说明.txt</span>
    </button>
    <button class="desk-ic" data-open="contact" type="button">
      <span class="art"><svg viewBox="0 0 96 96"><use href="#ap-contact"/></svg></span>
      <span class="lb">联系我</span>
    </button>
  </div>
  <div class="desk-hint" id="deskHint">点一下图标就打开 · 窗口可以拖、可以拉大</div>
</main>

<!-- ============ Dock ============ -->
<nav class="dock" id="dock">
  <button class="dock-item" data-app="rooms" type="button">
    <span class="tip">我的房间</span>
    <span class="di rooms"><svg viewBox="0 0 96 96"><use href="#ap-room"/></svg></span>
    <span class="dot"></span>
  </button>
  <button class="dock-item" data-app="works" type="button">
    <span class="tip">我的作品</span>
    <span class="di works"><svg viewBox="0 0 96 96"><use href="#ap-works"/></svg></span>
    <span class="dot"></span>
  </button>
  <button class="dock-item" data-app="about" type="button">
    <span class="tip">关于我</span>
    <span class="di about"><svg viewBox="0 0 96 96"><use href="#ap-about"/></svg></span>
    <span class="dot"></span>
  </button>
  <button class="dock-item" data-app="contact" type="button">
    <span class="tip">联系</span>
    <span class="di contact"><svg viewBox="0 0 96 96"><use href="#ap-contact"/></svg></span>
    <span class="dot"></span>
  </button>
  <span class="dock-sep"></span>
  <a class="dock-item" href="prompts/" target="_blank" rel="noopener">
    <span class="tip">提示词库</span>
    <span class="di ext p1"><svg viewBox="0 0 24 24"><use href="#ic-spark"/></svg></span>
  </a>
  <a class="dock-item" href="https://upmiao.com" target="_blank" rel="noopener">
    <span class="tip">upmiao.com</span>
    <span class="di ext p2"><svg viewBox="0 0 24 24"><use href="#ic-out"/></svg></span>
  </a>
  <a class="dock-item" href="https://github.com/Ss-miao" target="_blank" rel="noopener">
    <span class="tip">GitHub</span>
    <span class="di ext p3"><svg viewBox="0 0 24 24"><use href="#ic-github"/></svg></span>
  </a>
</nav>

<script src="os/data.js?v=20261120"></script>
<script src="os/wm.js?v=20261120"></script>
<script src="os/apps.js?v=20261120"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var two=function(n){return (n<10?'0':'')+n};

  /* ---- 时钟 ---- */
  var MOB = matchMedia('(max-width:760px)').matches;
  function tick(){
    var d=new Date(), wd='日一二三四五六'[d.getDay()];
    $('#lockTime').textContent=two(d.getHours())+':'+two(d.getMinutes());
    $('#lockDate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wd;
    $('#mbClock').textContent = MOB
      ? two(d.getHours())+':'+two(d.getMinutes())
      : (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wd+' '+two(d.getHours())+':'+two(d.getMinutes());
  }
  tick(); setInterval(tick,10000);

  /* 手机上「拖、拉大」不成立，换成铺满的说明；顺手把小字提示露出来当引导 */
  if(MOB){
    var dh=$('#deskHint');
    if(dh) dh.textContent='点一下图标，窗口会铺满整块屏幕';
  }

  /* ---- 解锁 ---- */
  var lock=$('#lock'), unlocked=false;
  function unlock(){
    if(unlocked) return; unlocked=true;
    lock.classList.add('out');
    document.body.classList.add('in');
    setTimeout(function(){ if(lock.parentNode) lock.parentNode.removeChild(lock); },700);
  }
  $('#lockEnter').addEventListener('click',unlock);
  document.addEventListener('keydown',function(e){
    if(!unlocked && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); unlock(); }
  });

  /* ---- 打开程序 ---- */
  document.addEventListener('click',function(e){
    var t=e.target.closest('.desk-ic[data-open],.mb-menu[data-open]');
    if(t){ unlock(); window.OS_APPS.open(t.dataset.open); return; }
    var d=e.target.closest('.dock-item[data-app]');
    if(d){ unlock(); window.OS_APPS.open(d.dataset.app); }
  });
  $('#mbBrand').addEventListener('click',function(){ window.OS_APPS.open('about'); });

  /* ---- Esc 关掉最上面那个窗口 ---- */
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    var wins=[].slice.call(document.querySelectorAll('.window'));
    if(!wins.length) return;
    wins.sort(function(a,b){ return (+b.style.zIndex||0)-(+a.style.zIndex||0); });
    window.OS_WM.close(wins[0].dataset.app);
  });

  /* ---- Dock 倒影：把图标镜像一份压在下面，靠遮罩渐隐 ---- */
  document.querySelectorAll('.dock-item .di').forEach(function(di){
    var svg=di.querySelector('svg'); if(!svg) return;
    var rx=document.createElement('span');
    rx.className='rx'+(di.classList.contains('ext')?' sm':'');
    rx.appendChild(svg.cloneNode(true));
    di.parentNode.appendChild(rx);
  });

  /* ---- 手机上别让长按弹菜单 ---- */
  document.addEventListener('contextmenu',function(e){
    if(e.target.closest('.desk-ic,.dock-item,.rm-card')) e.preventDefault();
  });
})();
</script>
</body>
</html>
