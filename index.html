<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>黄淼 OS</title>
<meta name="description" content="黄淼的桌面：两间住过的房子（点云还原，能走进去）、21 件视频作品、名片。">
<meta name="theme-color" content="#07070b">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="stylesheet" href="os/os.css?v=20261119">
</head>
<body>

<!-- ============ 图标 ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="ic-door" viewBox="0 0 24 24"><path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17"/><path d="M3 21h18"/><path d="M14.5 12v.01"/><path d="M8.5 3v18"/></symbol>
  <symbol id="ic-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16"/><path d="M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
  <symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.6 20.2a7.6 7.6 0 0 1 14.8 0"/></symbol>
  <symbol id="ic-mail" viewBox="0 0 24 24"><rect x="2.8" y="5" width="18.4" height="14" rx="2.4"/><path d="M4 7.2l8 5.4 8-5.4"/></symbol>
  <symbol id="ic-doc" viewBox="0 0 24 24"><path d="M6 3h7.6L19 8.4V21H6z"/><path d="M13.4 3v5.6H19"/><path d="M9 13h6M9 17h4"/></symbol>
  <symbol id="ic-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 4.9L18.7 9.7l-4.9 1.8L12 16.4l-1.8-4.9L5.3 9.7l4.9-1.8z"/><path d="M18 15.5l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z"/></symbol>
  <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M12.5 5.5L19 12l-6.5 6.5"/></symbol>
  <symbol id="ic-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></symbol>
  <symbol id="ic-full" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></symbol>
  <symbol id="ic-out" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="ic-github" viewBox="0 0 24 24"><path d="M9 19.5c-4 1.2-4-2-5.5-2.5M15 21v-3.4a3 3 0 0 0-.8-2.3c2.6-.3 5.3-1.3 5.3-5.8a4.5 4.5 0 0 0-1.2-3.1 4.2 4.2 0 0 0-.1-3.1s-1-.3-3.3 1.2a11.4 11.4 0 0 0-6 0C6.6 3 5.6 3.3 5.6 3.3a4.2 4.2 0 0 0-.1 3.1A4.5 4.5 0 0 0 4.3 9.5c0 4.5 2.7 5.5 5.3 5.8a3 3 0 0 0-.8 2.3V21"/></symbol>
  <symbol id="ic-wifi" viewBox="0 0 24 24"><path d="M2.5 8.5a15 15 0 0 1 19 0"/><path d="M6 12.5a10 10 0 0 1 12 0"/><path d="M9.4 16.3a5 5 0 0 1 5.2 0"/><path d="M12 20h.01"/></symbol>
  <symbol id="ic-batt" viewBox="0 0 26 13"><rect x=".8" y=".8" width="20" height="11.4" rx="3"/><rect x="2.6" y="2.6" width="14" height="7.8" rx="1.6" fill="currentColor" stroke="none"/><path d="M23 4.4v4.2" stroke-width="2.4"/></symbol>
</defs></svg>

<div class="wall"><div class="wall-img"></div><div class="wall-tint"></div><div class="wall-grain"></div></div>

<!-- ============ 锁屏 ============ -->
<div class="lock" id="lock">
  <div class="lock-date" id="lockDate">—</div>
  <div class="lock-time" id="lockTime">--:--</div>
  <div class="lock-user">
    <img class="lock-av" src="avatar.png" alt="">
    <span class="lock-name">黄淼的桌面</span>
    <button class="lock-enter" id="lockEnter" type="button">进来坐坐</button>
  </div>
</div>

<!-- ============ 菜单栏 ============ -->
<header class="menubar" id="menubar">
  <button class="mb-brand" id="mbBrand" type="button"><span class="mb-mk"></span>黄淼 OS</button>
  <button class="mb-menu" data-open="rooms" type="button">房间</button>
  <button class="mb-menu" data-open="works" type="button">作品</button>
  <button class="mb-menu" data-open="about" type="button">关于</button>
  <button class="mb-menu" data-open="contact" type="button">联系</button>
  <span class="mb-sp"></span>
  <span class="mb-st">
    <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round"><use href="#ic-wifi"/></svg>
    <svg viewBox="0 0 26 13" style="width:24px;height:12px;fill:none;stroke:currentColor;stroke-width:1.1"><use href="#ic-batt"/></svg>
  </span>
  <span class="mb-clock" id="mbClock">--</span>
</header>

<!-- ============ 桌面 ============ -->
<main class="desktop" id="desktop">
  <div class="desk-icons">
    <button class="desk-ic" data-open="rooms" type="button">
      <span class="art"><img src="home/assets/r1/preview.jpg" alt=""></span>
      <span class="lb">我的房间</span>
    </button>
    <button class="desk-ic" data-open="works" type="button">
      <span class="art"><img src="portfolio/thumbnails/东方天宫.jpg" alt=""></span>
      <span class="lb">我的作品</span>
    </button>
    <button class="desk-ic" data-open="readme" type="button">
      <span class="art tile"><svg viewBox="0 0 24 24"><use href="#ic-doc"/></svg></span>
      <span class="lb">说明.txt</span>
    </button>
    <button class="desk-ic" data-open="contact" type="button">
      <span class="art tile"><svg viewBox="0 0 24 24"><use href="#ic-mail"/></svg></span>
      <span class="lb">联系我</span>
    </button>
  </div>
  <div class="desk-hint" id="deskHint">点一下图标就打开 · 窗口可以拖、可以拉大</div>
</main>

<!-- ============ Dock ============ -->
<nav class="dock" id="dock">
  <button class="dock-item" data-app="rooms" type="button">
    <span class="tip">我的房间</span>
    <span class="di rooms"><svg viewBox="0 0 24 24"><use href="#ic-door"/></svg></span>
    <span class="dot"></span>
  </button>
  <button class="dock-item" data-app="works" type="button">
    <span class="tip">我的作品</span>
    <span class="di works"><svg viewBox="0 0 24 24"><use href="#ic-film"/></svg></span>
    <span class="dot"></span>
  </button>
  <button class="dock-item" data-app="about" type="button">
    <span class="tip">关于我</span>
    <span class="di about"><svg viewBox="0 0 24 24"><use href="#ic-user"/></svg></span>
    <span class="dot"></span>
  </button>
  <button class="dock-item" data-app="contact" type="button">
    <span class="tip">联系</span>
    <span class="di contact"><svg viewBox="0 0 24 24"><use href="#ic-mail"/></svg></span>
    <span class="dot"></span>
  </button>
  <span class="dock-sep"></span>
  <a class="dock-item" href="prompts/" target="_blank" rel="noopener">
    <span class="tip">提示词库</span>
    <span class="di ext"><svg viewBox="0 0 24 24"><use href="#ic-spark"/></svg></span>
  </a>
  <a class="dock-item" href="https://upmiao.com" target="_blank" rel="noopener">
    <span class="tip">upmiao.com</span>
    <span class="di ext"><svg viewBox="0 0 24 24"><use href="#ic-out"/></svg></span>
  </a>
  <a class="dock-item" href="https://github.com/Ss-miao" target="_blank" rel="noopener">
    <span class="tip">GitHub</span>
    <span class="di ext"><svg viewBox="0 0 24 24"><use href="#ic-github"/></svg></span>
  </a>
</nav>

<script src="os/data.js?v=20261119"></script>
<script src="os/wm.js?v=20261119"></script>
<script src="os/apps.js?v=20261119"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var two=function(n){return (n<10?'0':'')+n};

  /* ---- 时钟 ---- */
  var MOB = matchMedia('(max-width:760px)').matches;
  function tick(){
    var d=new Date(), wd='日一二三四五六'[d.getDay()];
    $('#lockTime').textContent=two(d.getHours())+':'+two(d.getMinutes());
    $('#lockDate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wd;
    $('#mbClock').textContent = MOB
      ? two(d.getHours())+':'+two(d.getMinutes())
      : (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wd+' '+two(d.getHours())+':'+two(d.getMinutes());
  }
  tick(); setInterval(tick,10000);

  /* ---- 解锁 ---- */
  var lock=$('#lock'), unlocked=false;
  function unlock(){
    if(unlocked) return; unlocked=true;
    lock.classList.add('out');
    document.body.classList.add('in');
    setTimeout(function(){ if(lock.parentNode) lock.parentNode.removeChild(lock); },700);
  }
  $('#lockEnter').addEventListener('click',unlock);
  document.addEventListener('keydown',function(e){
    if(!unlocked && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); unlock(); }
  });

  /* ---- 打开程序 ---- */
  document.addEventListener('click',function(e){
    var t=e.target.closest('.desk-ic[data-open],.mb-menu[data-open]');
    if(t){ unlock(); window.OS_APPS.open(t.dataset.open); return; }
    var d=e.target.closest('.dock-item[data-app]');
    if(d){ unlock(); window.OS_APPS.open(d.dataset.app); }
  });
  $('#mbBrand').addEventListener('click',function(){ window.OS_APPS.open('about'); });

  /* ---- Esc 关掉最上面那个窗口 ---- */
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    var wins=[].slice.call(document.querySelectorAll('.window'));
    if(!wins.length) return;
    wins.sort(function(a,b){ return (+b.style.zIndex||0)-(+a.style.zIndex||0); });
    window.OS_WM.close(wins[0].dataset.app);
  });

  /* ---- 手机上别让长按弹菜单 ---- */
  document.addEventListener('contextmenu',function(e){
    if(e.target.closest('.desk-ic,.dock-item,.rm-card')) e.preventDefault();
  });
})();
</script>
</body>
</html>
