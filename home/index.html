<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>余温 · 住过的地方</title>
<meta name="description" content="两间住过的房子，用两百万个高斯点原样存档。可以走进去，坐在床边，把灯关掉。">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<style>
:root{
  --bg:#fff; --bg-2:#fafafa; --line:#e9e9ee; --line-2:#f2f2f5;
  --ink:#0e1014; --ink-2:#5f6470; --ink-3:#9aa0ab;
  --grad:linear-gradient(100deg,#4b63f0 0%,#7a55e8 46%,#c052d8 100%);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font:"Inter","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ---------- 顶栏 ---------- */
.nav{position:sticky;top:0;z-index:30;height:58px;display:flex;align-items:center;gap:14px;
  padding:0 26px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:9px}
.mk{width:23px;height:23px;border-radius:7px;flex:none;position:relative;
  background:conic-gradient(from 210deg,#4b63f0,#8b5cf6,#c052d8,#4b63f0);
  box-shadow:0 0 0 1px rgba(75,99,240,.14)}
.mk::after{content:"";position:absolute;inset:6.5px;border-radius:2.5px;background:#fff;opacity:.96}
.brand b{font-size:14px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-3)}
.sp{flex:1}
.nav a.lk{font-size:13px;color:var(--ink-2);padding:6px 9px;border-radius:7px;transition:.15s}
.nav a.lk:hover{background:var(--line-2);color:var(--ink)}
.nav .ghost{display:inline-flex;align-items:center;gap:6px;height:31px;padding:0 13px;
  border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:500;transition:.15s}
.nav .ghost:hover{border-color:#d3d3dc;background:var(--bg-2)}

/* ---------- Hero ---------- */
.hero{position:relative;padding:104px 26px 66px;text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -10% auto;height:760px;pointer-events:none;
  background:
    radial-gradient(42% 46% at 22% 26%,rgba(75,99,240,.10),transparent 62%),
    radial-gradient(38% 44% at 74% 18%,rgba(192,82,216,.085),transparent 64%),
    radial-gradient(34% 40% at 52% 44%,rgba(122,85,232,.075),transparent 66%);
  filter:blur(8px)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(var(--line-2) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line-2) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 20%,#000,transparent 76%);
  mask-image:radial-gradient(70% 60% at 50% 20%,#000,transparent 76%)}
.hero>*{position:relative}
.tag{display:inline-flex;align-items:center;gap:8px;height:29px;padding:0 13px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.86);font-size:12px;color:var(--ink-2)}
.tag i{width:5px;height:5px;border-radius:50%;background:var(--grad)}
.hero h1{margin-top:26px;font-size:clamp(38px,6.2vw,68px);font-weight:750;letter-spacing:-.045em;
  line-height:1.04}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.hero p{margin:22px auto 0;max-width:520px;font-size:14.5px;line-height:1.95;color:var(--ink-2)}
.hero .sub{margin-top:30px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.hero .sub b{font-weight:500;color:var(--ink-2)}
.hero .sub s{width:1px;height:11px;background:var(--line);text-decoration:none;display:inline-block}

/* ---------- 项目卡 ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 26px 90px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.sec-t b{font-size:13px;font-weight:650;letter-spacing:-.006em}
.sec-t em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;
  overflow:hidden;background:#fff;transition:transform .28s cubic-bezier(.2,.7,.3,1),
  box-shadow .28s,border-color .28s;position:relative}
.card:hover{transform:translateY(-4px);border-color:#dcdce4;
  box-shadow:0 22px 48px -26px rgba(15,20,40,.32)}
.thumb{position:relative;aspect-ratio:16/11;overflow:hidden;background:#0b0d13}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .6s cubic-bezier(.2,.7,.3,1);filter:saturate(1.02)}
.card:hover .thumb img{transform:scale(1.035)}
.thumb::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(8,10,16,.42),transparent 46%)}
.no{position:absolute;left:14px;top:13px;z-index:2;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;color:#fff;background:rgba(12,14,20,.5);border:1px solid rgba(255,255,255,.18);
  padding:4px 9px;border-radius:999px;backdrop-filter:blur(10px)}
.year{position:absolute;right:14px;top:13px;z-index:2;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;color:rgba(255,255,255,.86);text-shadow:0 1px 4px rgba(0,0,0,.5)}
.go{position:absolute;right:14px;bottom:13px;z-index:2;display:inline-flex;align-items:center;gap:6px;
  height:29px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.92);
  font-size:11.5px;font-weight:600;color:#12141a;backdrop-filter:blur(8px);
  transform:translateY(4px);opacity:0;transition:.26s}
.card:hover .go{transform:none;opacity:1}
.c-body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.c-body h3{font-size:19px;font-weight:700;letter-spacing:-.025em;line-height:1.3}
.c-body .en{margin-top:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  color:var(--ink-3)}
.c-body p{margin-top:11px;font-size:12.5px;line-height:1.8;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;
  border-top:1px solid var(--line-2);padding-top:13px;margin-top:18px}
.stats div{padding-right:10px}
.stats span{display:block;font-size:9.5px;letter-spacing:.09em;color:var(--ink-3);text-transform:uppercase}
.stats b{display:block;margin-top:4px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- 底部 ---------- */
.foot{border-top:1px solid var(--line-2);padding:30px 26px 46px}
.foot-in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:16px;
  flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
.foot-in b{font-weight:500;color:var(--ink-2)}
.foot-in .sp{flex:1;min-width:20px}
.foot-in a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:#dcdce4}

@media(max-width:860px){
  .nav{padding:0 16px;height:54px}
  .nav a.lk{display:none}
  .hero{padding:66px 18px 44px}
  .hero p{font-size:13.5px}
  .wrap{padding:0 16px 60px}
  .grid{grid-template-columns:1fr;gap:14px}
  .thumb{aspect-ratio:16/10}
  .foot{padding:24px 16px 40px}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="./"><span class="mk" aria-hidden="true"></span><b>余温</b><span>住过的地方</span></a>
  <span class="sp"></span>
  <a class="lk" href="#rooms">两间房子</a>
  <a class="lk" href="#about">关于</a>
  <a class="ghost" href="https://ss-miao.github.io/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11 11 0 0 1 6 0C17.7 4.3 18.7 4.6 18.7 4.6c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
    主页
  </a>
</nav>

<header class="hero">
  <span class="tag"><i></i>两间房子 · 2023 — 2026</span>
  <h1>住过的<em>地方</em></h1>
  <p>用手机扫一遍，屋子就留下来了。两百万个光点，一个不差地记着墙角的灰、床垫的塌陷，还有晚上关灯以后窗外的路灯。</p>
  <div class="sub">
    <span><b>2</b> 份空间档案</span><s></s>
    <span><b>4,000,000</b> 高斯点</span><s></s>
    <span><b>人眼高度</b> 1.60 m</span>
  </div>
</header>

<div class="wrap" id="rooms">
  <div class="sec-t"><b>空间档案</b><em>ARCHIVE</em></div>
  <div class="grid" id="grid"></div>
</div>

<footer class="foot" id="about">
  <div class="foot-in">
    <span>这不是游戏 — 没有任务，没有分数，也没有东西可捡。</span>
    <span class="sp"></span>
    <span>SPZ · 高斯泼溅 · <b>WebGL2 实时渲染</b></span>
    <a href="https://ss-miao.github.io/" target="_blank" rel="noopener">关于我</a>
  </div>
</footer>

<script src="./data/projects.js"></script>
<script>
(function(){
  const grid=document.getElementById('grid');
  grid.innerHTML=window.PROJECT_ORDER.map(function(id){
    var p=window.PROJECTS[id];
    return '<a class="card" href="./room.html?p='+p.id+'">'+
      '<div class="thumb">'+
        '<span class="no">SCAN '+p.no+'</span>'+
        '<span class="year">'+p.span+'</span>'+
        '<img src="'+p.cover+'" alt="'+p.name+'" loading="lazy">'+
        '<span class="go">走进去'+
          '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M12 5l7 7-7 7"/></svg>'+
        '</span>'+
      '</div>'+
      '<div class="c-body">'+
        '<h3>'+p.name+'</h3>'+
        '<div class="en">'+p.en+' · '+p.place+'</div>'+
        '<p>'+p.blurb+'</p>'+
        '<div class="stats">'+
          '<div><span>面积</span><b>'+p.stats.area+'</b></div>'+
          '<div><span>尺寸</span><b>'+p.stats.size+'</b></div>'+
          '<div><span>层高</span><b>'+p.stats.height+'</b></div>'+
        '</div>'+
      '</div>'+
    '</a>';
  }).join('');
})();
</script>
</body>
</html>
